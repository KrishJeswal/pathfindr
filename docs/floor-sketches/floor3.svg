<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">

  <defs>
    <style>
      .bg{fill:#071827}
      .room{fill:#072b36; stroke:#0f7a7a; stroke-width:2}
      .corridor{fill:#0b3340}
      .label{font:13px Inter, Arial; fill:#cfeff9}
      .elev{fill:#1f4060}
      .stair-step{stroke:#cfeff9; stroke-width:1}
      .stair-box{stroke:#cfeff9; stroke-width:1; fill:none}
    </style>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" class="bg"/>
  <g transform="translate(-100,50)">

  <!-- ================= LAB (BOTTOM) ================= -->
  <rect x="550" y="420" width="250" height="220" class="room"/>
  <text x="680" y="540" class="label">LAB</text>

  <!-- ================= ET-301 ================= -->
  <rect x="600" y="320" width="200" height="100" class="room"/>
  <text x="660" y="380" class="label">ET-301</text>

  <!-- ================= CORRIDOR (VERTICAL) ================= -->
  <rect x="550" y="230" width="50" height="190" class="corridor"/>

  <!-- ================= LIFT ================= -->
  <rect x="600" y="280" width="40" height="40" class="elev"/>
  <text x="610" y="300" class="label">LIFT</text>

  <!-- ================= STAIRS (DOUBLE BLOCK) ================= -->
  <g transform="translate(600,233)">

    <!-- top stair -->
    <rect width="80" height="20" class="room"/>
    <rect width="80" height="20" class="stair-box"/>

    <line x1="10" y1="2" x2="10" y2="18" class="stair-step"/>
    <line x1="25" y1="2" x2="25" y2="18" class="stair-step"/>
    <line x1="40" y1="2" x2="40" y2="18" class="stair-step"/>
    <line x1="55" y1="2" x2="55" y2="18" class="stair-step"/>

    <!-- bottom stair -->
    <rect y="25" width="80" height="20" class="room"/>
    <rect y="25" width="80" height="20" class="stair-box"/>

    <line x1="10" y1="27" x2="10" y2="43" class="stair-step"/>
    <line x1="25" y1="27" x2="25" y2="43" class="stair-step"/>
    <line x1="40" y1="27" x2="40" y2="43" class="stair-step"/>
    <line x1="55" y1="27" x2="55" y2="43" class="stair-step"/>

  </g>
      </g>


  <!-- ================= ANGLED CORRIDOR ================= -->
  <g transform="rotate(39)">
    <rect x="529" y="-330" width="40" height="270" class="corridor"/>
  </g>
  <g transform="translate(-100,-50)">
  <!-- ================= TOP CORRIDOR ================= -->
  <rect x="560" y="120" width="200" height="50" class="corridor"/>

  <!-- ================= WASHROOMS ================= -->

  <!-- MEN -->
  <rect x="560" y="70" width="100" height="50" class="room"/>
  <text x="570" y="100" class="label">Men's</text>

  <!-- WOMEN -->
  <rect x="660" y="70" width="100" height="50" class="room"/>
  <text x="670" y="100" class="label">Women's</text>
     </g>

</svg>