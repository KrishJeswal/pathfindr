<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Spatial Tracker</title>
    <style>
        /* Base Cyber/Dark Theme */
        body { 
            background-color: #050910; /* Deep background from screenshot */
            color: #e0e6ed; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* Typography & Header */
        h2 { 
            color: #00d2ff; /* Cyan accent */
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 30px;
        }

        /* Search Input */
        .search-bar { 
            width: 100%; 
            padding: 15px; 
            font-size: 14px; 
            margin-bottom: 30px; 
            background-color: #0a111e;
            border: 1px solid #1a2a40; 
            border-radius: 8px; 
            color: #ffffff;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .search-bar:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }
        .search-bar::placeholder { color: #4a6180; }

        /* Faculty Cards */
        .card-container { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .faculty-card { 
            background: #0a111e; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #1a2a40;
            display: none; 
            transition: all 0.3s ease;
        }
        .faculty-card.visible { 
            display: flex; 
            justify-content: space-between;
            align-items: center;
        }
        
        .info-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .name { 
            margin: 0; 
            font-size: 1.1rem; 
            font-weight: 600; 
            color: #ffffff;
        }
        .location-text { 
            margin: 0; 
            color: #6c84a3; 
            font-size: 0.85rem; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Status Indicators */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(0,0,0,0.3);
        }
        .status-dot { 
            height: 8px; 
            width: 8px; 
            border-radius: 50%; 
            display: inline-block; 
        }

        /* Available State */
        .available { border-left: 4px solid #00ffaa; }
        .available .status-badge { color: #00ffaa; border: 1px solid rgba(0, 255, 170, 0.2); }
        .available .status-dot { background-color: #00ffaa; box-shadow: 0 0 8px #00ffaa;}

        /* Absent State */
        .absent { border-left: 4px solid #ff3366; }
        .absent .status-badge { color: #ff3366; border: 1px solid rgba(255, 51, 102, 0.2); }
        .absent .status-dot { background-color: #ff3366; box-shadow: 0 0 8px #ff3366; }

    </style>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container">
        <h2>System Telemetry: Faculty Nodes</h2>
        <input type="text" id="searchInput" class="search-bar" placeholder="Target faculty vector (e.g., Nagraj)..." onkeyup="filterFaculty()">

        <div class="card-container">
            <div class="faculty-card visible absent" id="card_Dr_Nagraj">
                <div class="info-group">
                    <h3 class="name">Dr. Nagraj</h3>
                    <p class="location-text">Loc: Offline</p>
                </div>
                <div class="status-badge">
                    <span class="status-dot"></span><span class="status-text">Disconnected</span>
                </div>
            </div>

            <div class="faculty-card visible absent" id="card_Dr_Shambulinga">
                <div class="info-group">
                    <h3 class="name">Dr. Shambulinga</h3>
                    <p class="location-text">Loc: Offline</p>
                </div>
                <div class="status-badge">
                    <span class="status-dot"></span><span class="status-text">Disconnected</span>
                </div>
            </div>

            <div class="faculty-card visible absent" id="card_Dr_Sandhya">
                <div class="info-group">
                    <h3 class="name">Dr. Sandhya</h3>
                    <p class="location-text">Loc: Offline</p>
                </div>
                <div class="status-badge">
                    <span class="status-dot"></span><span class="status-text">Disconnected</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- IMPORTANT: PASTE YOUR FIREBASE CONFIG HERE ---
        const firebaseConfig = {
            databaseURL: "https://faculty-monitoring-system-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const facultyRef = db.ref('faculty');
        
        facultyRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            for (const [key, info] of Object.entries(data)) {
                const card = document.getElementById(`card_${key}`);
                if (card) {
                    const statusText = card.querySelector('.status-text');
                    const locationText = card.querySelector('.location-text');
                    
                    statusText.innerText = info.status;
                    locationText.innerText = `Loc: ${info.location}`;

                    if (info.status === "Available") {
                        card.classList.add('available');
                        card.classList.remove('absent');
                    } else {
                        card.classList.add('absent');
                        card.classList.remove('available');
                    }
                }
            }
        });

        function filterFaculty() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('faculty-card');

            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].querySelector('.name').innerText.toLowerCase();
                if (name.includes(input)) {
                    cards[i].classList.add('visible');
                } else {
                    cards[i].classList.remove('visible');
                }
            }
        }
    </script>
</body>
</html>
